# Server Configuration (compatible with Render/Railway dynamic PORT)
server.port=${PORT:8081}

# Application Details
spring.application.name=dispatch-load-balancer

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:dispatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (useful for dev/debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator Configuration for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
